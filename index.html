<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropLink - Transferência P2P Instantânea com Progresso</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- PeerJS para conexões P2P diretas -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            dark: { 950: '#070a13', 900: '#0d1322', 850: '#131b2e', 800: '#1a243b', 700: '#283552', border: '#23304a' },
            accent: { blue: '#3b82f6', cyan: '#06b6d4', emerald: '#10b981' }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070a13; }
    ::-webkit-scrollbar-thumb { background: #1a243b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #283552; }
    .drop-zone-active { border-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.08) !important; }
  </style>
</head>
<body class="bg-dark-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white antialiased">

  <!-- HEADER -->
  <header class="border-b border-dark-border/60 bg-dark-900/80 backdrop-blur-xl sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 flex items-center justify-center text-white shadow-lg shadow-blue-500/25">
          <i class="fa-solid fa-bolt text-sm"></i>
        </div>
        <div>
          <span class="font-bold text-lg tracking-tight text-white flex items-center gap-2">
            DropLink
            <span class="text-[10px] font-mono font-semibold px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">P2P Ultra</span>
          </span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="clearAllBtn" class="hidden text-xs text-gray-400 hover:text-rose-400 px-3 py-1.5 rounded-xl border border-dark-border hover:border-rose-500/30 transition-all flex items-center gap-1.5 bg-dark-850">
          <i class="fa-solid fa-trash-can text-[11px]"></i>
          <span>Limpar Tudo</span>
        </button>
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shadow-lg shadow-emerald-500/50" title="Sistema pronto"></div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">

    <!-- MODO RECEPTOR (CELULAR) -->
    <section id="receiverView" class="hidden max-w-md mx-auto w-full bg-dark-900 border border-dark-border rounded-3xl p-8 text-center space-y-6 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-12 -right-12 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-blue-600/20 to-cyan-500/20 border border-blue-500/30 text-blue-400 flex items-center justify-center text-3xl mx-auto shadow-xl">
        <i class="fa-solid fa-cloud-arrow-down animate-bounce"></i>
      </div>
      <div>
        <h2 id="receiverFileName" class="text-lg font-bold text-white truncate px-4">Recebendo Arquivo...</h2>
        <p id="receiverStatus" class="text-xs text-gray-400 mt-1">Conectando ao computador de origem...</p>
      </div>
      
      <!-- Barra de Progresso (Receptor) -->
      <div class="space-y-2">
        <div class="w-full bg-dark-950 rounded-full h-3 border border-dark-border overflow-hidden p-0.5">
          <div id="receiverProgressBar" class="bg-gradient-to-r from-blue
