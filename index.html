<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropLink Cloud - Transferência Real entre Dispositivos</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- QRCode.js & Html5-Qrcode Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <!-- Firebase SDK (Modular CDN com as suas credenciais) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCM3emrQ2H8DIDiBvrfiqQ7Y7_OaipXx1M",
      authDomain: "archivetrasnfer.firebaseapp.com",
      projectId: "archivetrasnfer",
      storageBucket: "archivetrasnfer.firebasestorage.app",
      messagingSenderId: "165069438021",
      appId: "1:165069438021:web:8659fc5452c5cac131372c",
      measurementId: "G-6GSKK9PBJP"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    window.firebaseStorage = { storage, ref, uploadBytesResumable, getDownloadURL };
  </script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              950: '#090d16',
              900: '#111726',
              850: '#172033',
              800: '#1e293b',
              border: '#27354a'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="border-b border-dark-border bg-dark-900/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg">
          <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
        </div>
        <span class="font-bold text-lg text-white">DropLink <span class="text-xs text-blue-400 font-mono">Cloud</span></span>
      </div>
      <button id="openCameraBtn" class="px-4 py-2 bg-dark-800 hover:bg-dark-700 text-xs font-medium rounded-xl border border-dark-border flex items-center gap-2 transition-colors">
        <i class="fa-solid fa-camera text-blue-400"></i>
        <span>Ler QR Code com Câmara</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-4xl w-full mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
    
    <!-- UPLOAD SECTION -->
    <section class="bg-dark-900 border border-dark-border rounded-2xl p-6 space-y-6">
      <h2 class="text-base font-bold text-white">Enviar Ficheiro para a Nuvem</h2>
      
      <div id="dropZone" class="border-2 border-dashed border-dark-border hover:border-blue-500 rounded-xl p-8 text-center cursor-pointer transition-all">
        <input type="file" id="fileInput" class="hidden">
        <i class="fa-solid fa-file-arrow-up text-3xl text-blue-400 mb-3"></i>
        <p class="text-sm font-semibold text-gray-200">Arraste ou clique para enviar</p>
        <p class="text-xs text-gray-500 mt-1">O ficheiro ficará disponível globalmente via QR Code.</p>
      </div>

      <!-- Barra de Progresso -->
      <div id="progressContainer" class="hidden space-y-2">
        <div class="flex justify-between text-xs text-gray-400">
          <span id="uploadStatusText">A enviar para a nuvem...</span>
          <span id="uploadPercent">0%</span>
        </div>
        <div class="w-full bg-dark-800 h-2 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>
    </section>

    <!-- QR CODE & DOWNLOAD SECTION -->
    <section id="resultSection" class="bg-dark-900 border border-dark-border rounded-2xl p-6 text-center space-y-5 hidden">
      <h2 class="text-base font-bold text-white">Pronto para Transferência</h2>
      
      <div class="bg-white p-4 rounded-xl inline-block shadow-lg" id="qrcodeContainer"></div>
      
      <div class="space-y-2">
        <label class="text-xs text-gray-400">Link Direto na Nuvem</label>
        <input type="text" id="cloudUrlInput" readonly class="w-full bg-dark-950 border border-dark-border rounded-lg px-3 py-2 text-xs font-mono text-blue-400 text-center">
      </div>

      <a id="downloadCloudBtn" href="#" target="_blank" class="block w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-medium transition-colors">
        Descarregar Ficheiro
      </a>
    </section>

  </main>

  <!-- MODAL DA CÂMARA (LEITOR DE QR CODE) -->
  <div id="cameraModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-dark-900 border border-dark-border rounded-2xl max-w-md w-full p-6 space-y-4 relative">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-white">Aponte para o QR Code</h3>
        <button id="closeCameraBtn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="reader" class="w-full rounded-xl overflow-hidden border border-dark-border"></div>
    </div>
  </div>

  <script type="module">
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const uploadPercent = document.getElementById('uploadPercent');
    const resultSection = document.getElementById('resultSection');
    const qrcodeContainer = document.getElementById('qrcodeContainer');
    const cloudUrlInput = document.getElementById('cloudUrlInput');
    const downloadCloudBtn = document.getElementById('downloadCloudBtn');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleUpload(e.target.files[0]));

    async function handleUpload(file) {
      if (!file) return;
      progressContainer.classList.remove('hidden');
      resultSection.classList.add('hidden');

      try {
        const { storage, ref, uploadBytesResumable, getDownloadURL } = window.firebaseStorage;
        const storageRef = ref(storage, 'uploads/' + Date.now() + '_' + file.name);
        const uploadTask = uploadBytesResumable(storageRef, file);

        uploadTask.on('state_changed', 
          (snapshot) => {
            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
            progressBar.style.width = progress + '%';
            uploadPercent.textContent = Math.round(progress) + '%';
          }, 
          (error) => {
            alert('Erro no envio: ' + error.message);
          }, 
          async () => {
            const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
            showResult(downloadURL);
          }
        );
      } catch (err) {
        alert("Erro ao conectar com o Firebase Storage. Verifique as regras de segurança.");
      }
    }

    function showResult(url) {
      progressContainer.classList.add('hidden');
      resultSection.classList.remove('hidden');
      cloudUrlInput.value = url;
      downloadCloudBtn.href = url;

      qrcodeContainer.innerHTML = '';
      new QRCode(qrcodeContainer, {
        text: url,
        width: 160,
        height: 160,
        colorDark: "#090d16",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // Leitor de QR Code via Câmara
    const openCameraBtn = document.getElementById('openCameraBtn');
    const cameraModal = document.getElementById('cameraModal');
    const closeCameraBtn = document.getElementById('closeCameraBtn');
    let html5QrCode = null;

    openCameraBtn.addEventListener('click', () => {
      cameraModal.classList.remove('hidden');
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          if (decodedText.startsWith('http')) {
            window.location.href = decodedText;
          }
        },
        (errorMessage) => {}
      ).catch(err => {
        console.error("Erro ao abrir câmara:", err);
      });
    });

    closeCameraBtn.addEventListener('click', () => {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          cameraModal.classList.add('hidden');
        }).catch(err => console.log(err));
      } else {
        cameraModal.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
