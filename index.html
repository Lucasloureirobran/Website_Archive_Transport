<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropLink - P2P Ultra Transfer (Darker #023C40 Theme)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- PeerJS para conexões P2P diretas -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- JSZip para compactação de múltiplos arquivos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            dark: { 
              950: '#04060b', // Fundo geral bem escuro e profundo
              900: '#023C40', // Cor principal solicitada nos cards/header
              850: '#022d30', 
              800: '#022224', 
              700: '#034e54', 
              border: '#054e54' 
            },
            accent: { blue: '#2dd4bf', cyan: '#06b6d4', emerald: '#10b981' }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #04060b; }
    ::-webkit-scrollbar-thumb { background: #022224; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #034e54; }
    .drop-zone-active { border-color: #2dd4bf !important; background-color: rgba(45, 212, 191, 0.08) !important; }
  </style>
</head>
<body class="bg-dark-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-teal-500 selection:text-white antialiased">

  <!-- HEADER -->
  <header class="border-b border-dark-border/40 bg-dark-900/95 backdrop-blur-xl sticky top-0 z-40 shadow-xl">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-teal-700 via-teal-600 to-cyan-500 flex items-center justify-center text-white shadow-lg shadow-teal-900/50">
          <i class="fa-solid fa-bolt text-sm"></i>
        </div>
        <div>
          <span class="font-bold text-lg tracking-tight text-white flex items-center gap-2">
            DropLink
            <span class="text-[10px] font-mono font-semibold px-2 py-0.5 rounded-full bg-black/30 text-teal-200 border border-teal-500/30">P2P Secure</span>
          </span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="clearAllBtn" class="hidden text-xs text-gray-300 hover
